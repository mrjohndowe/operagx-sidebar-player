
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Sidebar</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div>
                <h1>Video Sidebar</h1>
                <p class="subtitle">Your saved video playlists</p>
            </div>
            <span class="status-dot" id="statusDot"></span>
        </header>

        <section class="playlist-manager panel">
            <label for="savedPlaylistSelect">Saved playlists</label>
            <select id="savedPlaylistSelect">
                <option value="">No saved playlists</option>
            </select>

            <div class="button-grid">
                <button id="loadPlaylistBtn" class="button primary">Load</button>
                <button id="savePlaylistBtn" class="button">Save As</button>
                <button id="newPlaylistBtn" class="button">New</button>
                <button id="deletePlaylistBtn" class="button danger">Delete</button>
            </div>

            <div class="active-playlist">
                Active: <strong id="activePlaylistName">Untitled Playlist</strong>
            </div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2>Playlist</h2>
                <span id="playlistCount" class="count">0 videos</span>
            </div>

            <div class="button-grid">
                <button id="addVideoBtn" class="button primary">+ Add Current Video</button>
                <button id="clearPlaylistBtn" class="button danger">Clear Active</button>
            </div>

            <label class="toggle-row">
                <input type="checkbox" id="autoAddToggle">
                <span>Automatically add detected videos</span>
            </label>

            <div id="playlistItems" class="playlist-items">
                <div class="empty-state">Your playlist is empty.</div>
            </div>
        </section>

        <section class="player-section">
            <div class="section-heading">
                <h2>Player</h2>
                <button id="openVideoBtn" class="small-button">Open in Tab</button>
            </div>

            <div class="player-wrapper">
                <iframe
                    id="videoPlayer"
                    src="about:blank"
                    allow="autoplay; fullscreen; picture-in-picture"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <div id="playerTitle" class="player-title">Select a video to play</div>
        </section>

        <footer>
            <span id="saveStatus">Changes are automatically saved.</span>
        </footer>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
